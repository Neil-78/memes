<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimic Meme Party</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .blob {
            position: absolute;
            filter: blur(40px);
            z-index: -1;
            opacity: 0.6;
        }
        .mic-pulse {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="relative flex flex-col items-center justify-center p-4">
    <!-- Fondos decorativos -->
    <div class="blob bg-blue-500 w-64 h-64 rounded-full top-10 left-10"></div>
    <div class="blob bg-purple-500 w-72 h-72 rounded-full bottom-10 right-10"></div>

    <div id="app" class="w-full max-w-md glass-card rounded-3xl p-6 relative overflow-hidden transition-all duration-500">
        
        <!-- PANTALLA 1: INICIO Y LOBBY -->
        <div id="screen-lobby" class="flex flex-col items-center text-center space-y-6">
            <h1 class="text-4xl font-extrabold tracking-tight drop-shadow-lg">MIMIC PARTY</h1>
            <p class="text-blue-200">Copiar sonido. Retar amigos.</p>
            
            <div class="w-full bg-white/10 p-4 rounded-xl space-y-4">
                <input type="text" id="playerName" placeholder="Tu Nombre" class="w-full bg-white/20 border-2 border-white/30 rounded-lg p-3 text-white placeholder-blue-200 focus:outline-none focus:border-white text-center font-bold text-lg">
                
                <p class="text-sm text-blue-200 font-semibold">Elige tu personaje:</p>
                <div class="flex justify-center gap-3" id="avatarSelector">
                    <button class="avatar-btn text-3xl bg-white/20 p-2 rounded-full border-2 border-transparent hover:border-white focus:border-white transition" data-avatar="👽">👽</button>
                    <button class="avatar-btn text-3xl bg-white/20 p-2 rounded-full border-2 border-transparent hover:border-white focus:border-white transition" data-avatar="🤖">🤖</button>
                    <button class="avatar-btn text-3xl bg-white/20 p-2 rounded-full border-2 border-transparent hover:border-white focus:border-white transition" data-avatar="🦄">🦄</button>
                    <button class="avatar-btn text-3xl bg-white/20 p-2 rounded-full border-2 border-transparent hover:border-white focus:border-white transition" data-avatar="🐵">🐵</button>
                </div>
            </div>

            <div class="w-full space-y-3 mt-4">
                <button onclick="startLocalGame()" class="w-full bg-green-500 hover:bg-green-400 text-white font-bold py-4 rounded-xl shadow-lg transition transform hover:scale-105">
                    Jugar Local (Pasar Teléfono)
                </button>
                
                <div class="flex gap-2">
                    <button onclick="createOnlineRoom()" class="flex-1 bg-blue-500 hover:bg-blue-400 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm">
                        Crear Sala Online
                    </button>
                    <div class="flex-1 flex gap-2">
                        <input type="text" id="roomCodeInput" placeholder="CÓDIGO" maxlength="4" class="w-1/2 bg-white/20 border border-white/30 rounded-xl text-center text-white font-bold uppercase">
                        <button onclick="joinOnlineRoom()" class="w-1/2 bg-purple-500 hover:bg-purple-400 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm">
                            Unirse
                        </button>
                    </div>
                </div>
            </div>
            
            <p id="lobbyMessage" class="text-yellow-300 font-bold h-6"></p>
        </div>

        <!-- PANTALLA 2: JUEGO -->
        <div id="screen-game" class="hidden flex flex-col items-center w-full space-y-6">
            <div class="w-full flex justify-between items-center mb-2">
                <span id="roomIndicator" class="bg-white/20 px-3 py-1 rounded-full text-xs font-bold hidden">SALA: ----</span>
                <button onclick="returnToLobby()" class="text-sm bg-red-500/80 px-3 py-1 rounded-full hover:bg-red-500 transition">Salir</button>
            </div>

            <div class="bg-white/20 px-6 py-2 rounded-full shadow-inner flex items-center gap-2">
                <span id="playerAvatarDisplay" class="text-2xl">👽</span>
                <span id="playerNameDisplay" class="font-bold text-lg">Jugador</span>
            </div>

            <div class="text-center space-y-2">
                <h2 class="text-2xl font-black uppercase text-yellow-300">¡Imita este Meme!</h2>
                <div class="bg-black/40 border-2 border-white/20 rounded-2xl p-6 min-h-[120px] flex items-center justify-center shadow-xl">
                    <p id="memeText" class="text-xl font-bold italic text-center">"Cargando meme..."</p>
                </div>
            </div>

            <div class="w-full max-w-[250px] space-y-4 pt-4">
                <button id="listenBtn" onclick="listenMeme()" class="w-full bg-blue-500 hover:bg-blue-400 text-white font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                    <span>🔊</span> Escuchar Audio
                </button>
                
                <button id="actionBtn" onclick="startRecording()" class="w-full bg-red-500 hover:bg-red-400 text-white font-bold py-4 rounded-xl shadow-lg transition transform hover:scale-105 flex items-center justify-center gap-2">
                    <span>🎤</span> Grabar (5 seg)
                </button>
            </div>

            <div id="recordingStatus" class="hidden flex flex-col items-center space-y-2">
                <div class="w-12 h-12 bg-red-500 rounded-full mic-pulse flex items-center justify-center">🎙️</div>
                <p class="text-red-300 font-bold animate-pulse">Analizando voz...</p>
            </div>
        </div>

        <!-- PANTALLA 3: RESULTADO -->
        <div id="screen-result" class="hidden flex flex-col items-center w-full space-y-6 text-center">
            <h2 class="text-3xl font-black text-yellow-300">RESULTADO</h2>
            
            <div class="relative w-48 h-48 flex items-center justify-center bg-black/30 rounded-full border-4 border-white/20 shadow-2xl">
                <div class="absolute inset-0 border-8 border-transparent border-t-green-400 rounded-full animate-spin" style="animation-duration: 3s;"></div>
                <div class="flex flex-col items-center">
                    <span id="scoreDisplay" class="text-6xl font-black">0</span>
                    <span class="text-sm text-gray-300">PUNTOS</span>
                </div>
            </div>

            <p id="feedbackText" class="text-xl font-bold text-blue-200 h-10">¡Calculando!</p>

            <div id="leaderboard" class="w-full bg-white/10 rounded-xl p-4 hidden">
                <h3 class="font-bold text-yellow-300 mb-2">Tabla de Posiciones</h3>
                <ul id="leaderboardList" class="space-y-2 text-sm text-left">
                    <!-- Se llena con JS -->
                </ul>
            </div>

            <div class="w-full space-y-3 pt-4">
                <button onclick="nextRound()" class="w-full bg-green-500 hover:bg-green-400 text-white font-bold py-3 rounded-xl shadow-lg transition">
                    Siguiente Ronda
                </button>
                <button id="changePlayerBtn" onclick="returnToLobby()" class="w-full bg-blue-500/50 hover:bg-blue-400/50 text-white font-bold py-3 rounded-xl transition">
                    Cambiar Jugador
                </button>
            </div>
        </div>

    </div>

    <!-- FIREBASE CONFIGURATION (VERSIÓN CDN PARA HTML) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // TUS CREDENCIALES REALES
        const firebaseConfig = {
            apiKey: "AIzaSyAO6BmJ-eYn7eJu9u6e7p3-u0B-bVJyg5M",
            authDomain: "memes-cdfc7.firebaseapp.com",
            databaseURL: "https://memes-cdfc7-default-rtdb.firebaseio.com",
            projectId: "memes-cdfc7",
            storageBucket: "memes-cdfc7.firebasestorage.app",
            messagingSenderId: "41164409309",
            appId: "1:41164409309:web:adaacd974ef2d512ec8e34",
            measurementId: "G-T3RGX3PJ5F"
        };

        const app = initializeApp(firebaseConfig);
        
        window.db = getDatabase(app);
        window.dbRef = ref;
        window.dbSet = set;
        window.dbOnValue = onValue;
        window.dbUpdate = update;
        window.dbRemove = remove;
        window.dbGet = get;

        window.firebaseInitialized = true;
    </script>

    <!-- LOGICA DEL JUEGO -->
    <script>
        const memes = [
            "Pintamos toda la casa... ¡Qué es eso!",
            "Me presento, mi nombre es el Pepe",
            "Ete Sech",
            "Oh my gah!",
            "Tengo miedo, tengo miedo",
            "Wey ya",
            "Emosido engañado",
            "¡No me simpatizas!",
            "Se tenía que decir y se dijo"
        ];

        let currentPlayer = { name: '', avatar: '👽' };
        let currentMeme = "";
        let isOnlineMode = false;
        let currentRoomId = null;

        // Variables para captura de audio real
        let audioContext;
        let analyser;
        let microphone;
        let recordingInterval;
        let audioScore = 0;

        // Selección de Avatar
        document.querySelectorAll('.avatar-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('border-white', 'bg-white/40'));
                e.target.classList.add('border-white', 'bg-white/40');
                currentPlayer.avatar = e.target.getAttribute('data-avatar');
            });
        });

        function getPlayerInfo() {
            let nameInput = document.getElementById('playerName').value.trim();
            if(!nameInput) {
                showLobbyMessage("¡Escribe tu nombre primero!");
                return false;
            }
            // Easter Egg para Paola/Regina
            if(nameInput.toLowerCase() === 'paola' || nameInput.toLowerCase() === 'regina') {
                nameInput += " (Botoncito 💖)";
            }
            currentPlayer.name = nameInput;
            return true;
        }

        function showLobbyMessage(msg) {
            const msgEl = document.getElementById('lobbyMessage');
            msgEl.textContent = msg;
            setTimeout(() => msgEl.textContent = "", 3000);
        }

        function showScreen(screenId) {
            ['screen-lobby', 'screen-game', 'screen-result'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        // --- MODO LOCAL ---
        function startLocalGame() {
            if(!getPlayerInfo()) return;
            isOnlineMode = false;
            document.getElementById('roomIndicator').classList.add('hidden');
            document.getElementById('leaderboard').classList.add('hidden');
            document.getElementById('changePlayerBtn').classList.remove('hidden');
            setupRound();
            showScreen('screen-game');
        }

        // --- MODO ONLINE ---
        function generateRoomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let code = '';
            for(let i=0; i<4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            return code;
        }

        function createOnlineRoom() {
            if(!window.firebaseInitialized) {
                showLobbyMessage("Conectando a servidores... intenta en un segundo.");
                return;
            }
            if(!getPlayerInfo()) return;

            currentRoomId = generateRoomCode();
            isOnlineMode = true;
            
            const roomRef = window.dbRef(window.db, 'rooms/' + currentRoomId);
            window.dbSet(roomRef, {
                status: 'waiting',
                currentMeme: memes[Math.floor(Math.random() * memes.length)],
                players: {
                    [currentPlayer.name]: { avatar: currentPlayer.avatar, score: 0 }
                }
            }).then(() => {
                enterOnlineRoom();
            }).catch(err => {
                showLobbyMessage("Error al crear sala. Revisa las reglas de Firebase.");
                console.error(err);
            });
        }

        function joinOnlineRoom() {
            if(!window.firebaseInitialized) return;
            if(!getPlayerInfo()) return;
            
            const codeInput = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if(codeInput.length !== 4) {
                showLobbyMessage("Código inválido (4 letras)");
                return;
            }

            currentRoomId = codeInput;
            isOnlineMode = true;

            const roomRef = window.dbRef(window.db, 'rooms/' + currentRoomId);
            window.dbGet(roomRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const playerRef = window.dbRef(window.db, `rooms/${currentRoomId}/players/${currentPlayer.name}`);
                    window.dbSet(playerRef, { avatar: currentPlayer.avatar, score: 0 }).then(() => {
                        enterOnlineRoom();
                    });
                } else {
                    showLobbyMessage("La sala no existe");
                }
            });
        }

        function enterOnlineRoom() {
            document.getElementById('roomIndicator').classList.remove('hidden');
            document.getElementById('roomIndicator').textContent = "SALA: " + currentRoomId;
            document.getElementById('leaderboard').classList.remove('hidden');
            document.getElementById('changePlayerBtn').classList.add('hidden'); // Online no se pasa el cel

            // Escuchar cambios en la sala
            const roomRef = window.dbRef(window.db, 'rooms/' + currentRoomId);
            window.dbOnValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if(data && data.currentMeme) {
                    currentMeme = data.currentMeme;
                    document.getElementById('memeText').textContent = `"${currentMeme}"`;
                    updateLeaderboard(data.players);
                }
            });

            setupRound(true);
            showScreen('screen-game');
        }

        function updateLeaderboard(players) {
            const list = document.getElementById('leaderboardList');
            list.innerHTML = '';
            
            if(!players) return;

            const sortedPlayers = Object.keys(players).sort((a, b) => players[b].score - players[a].score);
            
            sortedPlayers.forEach(pName => {
                const pData = players[pName];
                const li = document.createElement('li');
                li.className = "flex justify-between items-center bg-black/20 p-2 rounded";
                li.innerHTML = `<span>${pData.avatar} ${pName}</span> <span class="font-bold">${pData.score} pts</span>`;
                list.appendChild(li);
            });
        }

        // --- FLUJO DEL JUEGO ---
        function setupRound(skipMemeGeneration = false) {
            document.getElementById('playerNameDisplay').textContent = currentPlayer.name;
            document.getElementById('playerAvatarDisplay').textContent = currentPlayer.avatar;
            document.getElementById('actionBtn').disabled = false;
            document.getElementById('actionBtn').classList.remove('opacity-50');
            document.getElementById('recordingStatus').classList.add('hidden');
            
            if(!isOnlineMode || !skipMemeGeneration) {
                currentMeme = memes[Math.floor(Math.random() * memes.length)];
                document.getElementById('memeText').textContent = `"${currentMeme}"`;
            }
        }

        function listenMeme() {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(currentMeme);
                utterance.lang = 'es-MX';
                utterance.rate = 1.1;
                utterance.pitch = 1.2;
                speechSynthesis.speak(utterance);
            } else {
                alert("Tu navegador no soporta lectura de voz.");
            }
        }

        // --- MEDICIÓN REAL DE AUDIO ---
        async function startRecording() {
            const actionBtn = document.getElementById('actionBtn');
            const recordingStatus = document.getElementById('recordingStatus');
            
            recordingStatus.classList.remove('hidden');
            actionBtn.disabled = true;
            actionBtn.classList.add('opacity-50');
            
            let totalVolume = 0;
            let samples = 0;
            let finalScore = 0;
            let isEasterEgg = (currentPlayer.name.includes('Botoncito'));

            try {
                // Solicitar acceso al micrófono
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                
                microphone.connect(analyser);
                analyser.fftSize = 256;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                // Medir volumen cada 100ms
                recordingInterval = setInterval(() => {
                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for(let i = 0; i < bufferLength; i++) {
                        sum += dataArray[i];
                    }
                    let average = sum / bufferLength;
                    totalVolume += average;
                    samples++;
                }, 100);

                // Esperar 5 segundos
                setTimeout(() => {
                    clearInterval(recordingInterval);
                    stream.getTracks().forEach(track => track.stop()); // Apagar micrófono
                    if(audioContext.state !== 'closed') audioContext.close();

                    // Calcular score basado en el volumen promedio de la imitación
                    let avgVolume = totalVolume / (samples || 1);
                    
                    // Mapeo: si hizo buen ruido (voz alta/entonada) puntúa mejor
                    finalScore = Math.floor(40 + (avgVolume * 1.5)); 
                    if(finalScore > 100) finalScore = 100;
                    if(avgVolume < 2) finalScore = Math.floor(Math.random() * 20) + 10; // No se escuchó nada

                    if(isEasterEgg) finalScore = 100; // Easter Egg

                    finishRecording(finalScore);

                }, 5000); // 5 SEGUNDOS

            } catch (err) {
                console.warn("Permiso de micrófono denegado o no disponible.", err);
                // Fallback a simulación si deniegan permiso
                setTimeout(() => {
                    finalScore = isEasterEgg ? 100 : Math.floor(Math.random() * 61) + 40;
                    finishRecording(finalScore);
                }, 5000); // 5 SEGUNDOS
            }
        }

        function finishRecording(score) {
            if(isOnlineMode) {
                const playerRef = window.dbRef(window.db, `rooms/${currentRoomId}/players/${currentPlayer.name}`);
                window.dbUpdate(playerRef, { score: score });
            }

            document.getElementById('scoreDisplay').textContent = "0";
            document.getElementById('feedbackText').textContent = "¡Analizando similitud!";
            showScreen('screen-result');
            
            // Animación de puntaje
            let currentDisplay = 0;
            let timer = setInterval(() => {
                currentDisplay += 3;
                if(currentDisplay >= score) {
                    currentDisplay = score;
                    clearInterval(timer);
                    
                    if (score === 100) {
                        document.getElementById('feedbackText').textContent = "¡PERFECCIÓN! 👑";
                    } else if (score > 80) {
                        document.getElementById('feedbackText').textContent = "¡Casi idéntico! 😂";
                    } else if (score > 50) {
                        document.getElementById('feedbackText').textContent = "Nada mal... 👏";
                    } else {
                        document.getElementById('feedbackText').textContent = "Necesitas practicar más 💀";
                    }
                }
                document.getElementById('scoreDisplay').textContent = currentDisplay;
            }, 30);
        }

        function nextRound() {
            if(isOnlineMode) {
                // El que le da a siguiente ronda cambia el meme para todos
                const newMeme = memes[Math.floor(Math.random() * memes.length)];
                const roomRef = window.dbRef(window.db, 'rooms/' + currentRoomId);
                window.dbUpdate(roomRef, { currentMeme: newMeme });
                // No llamamos showScreen porque el onValue de Firebase lo detectará y actualizará la pantalla (opcional)
                showScreen('screen-game');
                setupRound(true); // Evita cambiarlo localmente de nuevo
            } else {
                setupRound();
                showScreen('screen-game');
            }
        }

        function returnToLobby() {
            isOnlineMode = false;
            currentRoomId = null;
            showScreen('screen-lobby');
        }
    </script>
</body>
</html>
